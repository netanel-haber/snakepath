name: CI

# Every commit on every branch is built and tested once (push); a PR adds the jobs that compare with its base
on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          allow-prereleases: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang valgrind
          pip install clang-format==21.1.8

      - name: Build nob
        run: cc -x c -o nob nob.h

      - name: Run build and tests
        run: ./nob
        env:
          SNAKEPATH_SANITIZE: "1"

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          allow-prereleases: true

      - name: Install clang-format
        run: pip install clang-format==21.1.8

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build nob
        run: cl.exe /Fe:nob.exe /Tcnob.h

      - name: Run build and tests
        run: .\nob.exe

  # Informational: the pure path API against the PR's base branch through ./nob diff. A PR that changes behavior on
  # purpose differs by design, so this never blocks a merge; the report is for the reviewer.
  diff-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Build nob
        run: cc -x c -o nob nob.h

      - name: Differential check against the base branch
        run: ./nob diff origin/${{ github.base_ref }}

  diff-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build nob
        run: cl.exe /Fe:nob.exe /Tcnob.h

      - name: Differential check against the base branch
        run: .\nob.exe diff origin/${{ github.base_ref }}

  # Informational: a real program with pathlib, and with snakepath swapped in for pathlib's classes the way a user would
  # monkeypatch them (check.py bench): pytest collecting SymPy's tests, from the package pip builds
  bench-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install snakepath, and SymPy's tests with what SymPy's CI installs for them
        run: |
          git clone --depth 1 --branch sympy-1.14.0 https://github.com/sympy/sympy.git ../sympy
          pip install . -r ../sympy/requirements-dev.txt

      - name: pytest collecting SymPy's tests, with pathlib and with snakepath
        run: python check.py bench 10 ../sympy pytest --collect-only -q
