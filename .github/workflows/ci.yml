name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang valgrind
          pip install clang-format==21.1.8

      - name: Build nob
        run: cc -x c -o nob nob.h

      - name: Run build and tests
        run: ./nob
        env:
          SNAKEPATH_SANITIZE: "1"

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install clang-format
        run: pip install clang-format==21.1.8

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build nob
        run: cl.exe /Fe:nob.exe /Tcnob.h

      - name: Run build and tests
        run: .\nob.exe

  # Informational: the pure path API against the PR's base branch through ./nob diff. A PR that changes behavior on
  # purpose differs by design, so this never blocks a merge; the report is for the reviewer.
  diff-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Build nob
        run: cc -x c -o nob nob.h

      - name: Differential check against the base branch
        run: ./nob diff origin/${{ github.base_ref }}

  diff-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build nob
        run: cl.exe /Fe:nob.exe /Tcnob.h

      - name: Differential check against the base branch
        run: .\nob.exe diff origin/${{ github.base_ref }}

  # The site as GitHub Pages builds it, screenshotted at 1920x1080 for the maintainer to look at before merging. The
  # fonts are the Ubuntu runner's, not a Mac's.
  site-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the site with GitHub Pages' builder
        uses: actions/jekyll-build-pages@v1

      - name: Screenshot the site at 1920x1080
        run: >
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1920,1080
          --screenshot="$PWD/site-1920x1080.png" "file://$PWD/_site/index.html"

      - name: Upload the screenshot
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: site-1920x1080.png
          archive: false

      - name: Link the screenshot from the job summary
        run: echo "[Site at 1920x1080]($URL)" >> "$GITHUB_STEP_SUMMARY"
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}

  # Every CPython 3.15 release (3.15.0, 3.15.1, ...), read from setup-python's list of builds so a new one joins the
  # matrix by itself
  python-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.list.outputs.versions }}

    steps:
      - id: list
        shell: python
        run: |
          import json, os, re, urllib.request
          url = "https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json"
          versions = sorted({r["version"] for r in json.load(urllib.request.urlopen(url)) if re.fullmatch(r"3\.15\.\d+", r["version"])},
                            key=lambda v: int(v.split(".")[2]))
          assert versions, "no CPython 3.15 release listed"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"versions={json.dumps(versions)}", file=out)

  # Parity with each 3.15 release, on Linux and Windows: the bindings built for it, then the fuzz and check_fs against
  # its own pathlib and os, and CPython's pathlib tests from its own release tag. build-linux and build-windows run the
  # same checks on the latest release, with everything else
  parity:
    needs: python-releases
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ${{ fromJSON(needs.python-releases.outputs.versions) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the bindings and run their checks
        run: |
          python snakepath.py --build
          python snakepath.py

  # pip install snakepath: one stable-ABI (abi3) wheel per platform, for every CPython from 3.15 on, each tried once
  # where its runner can run it and audited for symbols outside the stable ABI
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Build wheels
        run: |
          pip install cibuildwheel==4.3.1
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp315-*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64 ARM64"
          CIBW_TEST_COMMAND: >-
            python -c "import snakepath as s, tempfile; d = s.Path(tempfile.mkdtemp()); (d / 'a').mkdir();
            (d / 'a' / 'f.py').write_text('x'); assert [p.name for p in d.rglob('*.py')] == ['f.py'];
            assert (d / 'a' / 'f.py').relative_to(d) == s.Path('a', 'f.py'); d._delete(); assert not d.exists()"

      - name: Check that the wheels use only the stable ABI
        shell: bash
        run: pipx run abi3audit==0.0.26 --strict --report wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the source distribution
        run: pipx run build==1.6.1 --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
