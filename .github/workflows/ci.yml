name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          allow-prereleases: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang valgrind
          pip install clang-format==21.1.8

      - name: Build nob
        run: cc -x c -o nob nob.h

      - name: Run build and tests
        run: ./nob
        env:
          SNAKEPATH_SANITIZE: "1"

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          allow-prereleases: true

      - name: Install clang-format
        run: pip install clang-format==21.1.8

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build nob
        run: cl.exe /Fe:nob.exe /Tcnob.h

      - name: Run build and tests
        run: .\nob.exe

  # Informational: the pure path API against the PR's base branch through ./nob diff. A PR that changes behavior on
  # purpose differs by design, so this never blocks a merge; the report is for the reviewer.
  diff-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Build nob
        run: cc -x c -o nob nob.h

      - name: Differential check against the base branch
        run: ./nob diff origin/${{ github.base_ref }}

  diff-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build nob
        run: cl.exe /Fe:nob.exe /Tcnob.h

      - name: Differential check against the base branch
        run: .\nob.exe diff origin/${{ github.base_ref }}
