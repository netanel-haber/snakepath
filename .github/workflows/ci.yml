name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang valgrind
          pip install clang-format==21.1.8

      - name: Build nob
        run: cc -x c -o nob nob.h

      - name: Run build and tests
        run: ./nob
        env:
          SNAKEPATH_SANITIZE: "1"

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install clang-format
        run: pip install clang-format==21.1.8

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build nob
        run: cl.exe /Fe:nob.exe /Tcnob.h

      - name: Run build and tests
        run: .\nob.exe

  # macOS's compiler is clang, so nob builds with clang only, sanitizers included; valgrind doesn't run there
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install clang-format
        run: pip install clang-format==21.1.8

      - name: Build nob
        run: cc -x c -o nob nob.h

      - name: Run build and tests
        run: ./nob
        env:
          SNAKEPATH_SANITIZE: "1"

  # FreeBSD in a VM on the Linux runner, its base clang building everything, as a user that permissions bind
  build-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build and tests on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: |
            pkg install -y python315 llvm21
            ln -sf /usr/local/bin/python3.15 /usr/local/bin/python3
            ln -sf /usr/local/llvm21/bin/clang-format /usr/local/bin/clang-format
            pw useradd ci -m
          run: |
            chown -R ci .
            su ci -c 'cc -x c -o nob nob.h && ./nob'

  # Informational: the pure path API against the PR's base branch through ./nob diff. A PR that changes behavior on
  # purpose differs by design, so this never blocks a merge; the report is for the reviewer.
  diff-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Build nob
        run: cc -x c -o nob nob.h

      - name: Differential check against the base branch
        run: ./nob diff origin/${{ github.base_ref }}

  diff-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the base branch
        run: git fetch --depth=1 origin ${{ github.base_ref }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build nob
        run: cl.exe /Fe:nob.exe /Tcnob.h

      - name: Differential check against the base branch
        run: .\nob.exe diff origin/${{ github.base_ref }}

  # The site as GitHub Pages builds it, screenshotted at 1920x1080 for the maintainer to look at before merging. The
  # fonts are the Ubuntu runner's, not a Mac's.
  site-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Put the README, the site's page, in the site's folder
        run: cp README.md site/README.md

      - name: Build the site with GitHub Pages' builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site

      - name: Screenshot the site at 1920x1080
        run: >
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1920,1080
          --screenshot="$PWD/site-1920x1080.png" "file://$PWD/_site/index.html"

      - name: Upload the screenshot
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: site-1920x1080.png
          archive: false

      - name: Link the screenshot from the job summary
        run: echo "[Site at 1920x1080]($URL)" >> "$GITHUB_STEP_SUMMARY"
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}

  # The site (site/, with README.md as its page) as GitHub Pages builds it, plus logo.wasm and snake.c made from
  # site/logo.c (the logo's toy), deployed from main
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Put the README, the site's page, in the site's folder
        run: cp README.md site/README.md

      - name: Build the site with GitHub Pages' builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site

      - name: Install the WebAssembly linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Compile logo.c to logo.wasm
        run: |
          clang -std=c99 --target=wasm32 -mbulk-memory -O2 -nostdlib -Wall -Wextra -Werror -pedantic \
            -Wl,--no-entry -Wl,--export=logo_frame,--export=logo_set,--export=logo_out -o logo.wasm site/logo.c
          sudo cp logo.wasm _site/logo.wasm

      - name: Make snake.c, the site's export, with nob and trim.h
        run: |
          cc -x c -o nob nob.h && ./nob snake
          sudo cp site/snake.c _site/snake.c

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-site:
    needs: site
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy the site
        id: deploy
        uses: actions/deploy-pages@v4

  # Every CPython 3.15 release (3.15.0, 3.15.1, ...), read from setup-python's list of builds so a new one joins the
  # matrix by itself
  python-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.list.outputs.versions }}

    steps:
      - id: list
        shell: python
        run: |
          import json, os, re, urllib.request
          url = "https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json"
          versions = sorted({r["version"] for r in json.load(urllib.request.urlopen(url)) if re.fullmatch(r"3\.15\.\d+", r["version"])},
                            key=lambda v: int(v.split(".")[2]))
          assert versions, "no CPython 3.15 release listed"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"versions={json.dumps(versions)}", file=out)

  # Parity with each 3.15 release, on Linux, Windows and macOS: the bindings built for it, then the fuzz and check_fs
  # against its own pathlib and os, and CPython's pathlib tests from its own release tag. The build jobs run the same
  # checks on the latest release, with everything else
  parity:
    needs: python-releases
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ${{ fromJSON(needs.python-releases.outputs.versions) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the bindings and run their checks
        run: |
          python snakepath.py --build
          python snakepath.py

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the source distribution
        run: pipx run build==1.6.1 --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
